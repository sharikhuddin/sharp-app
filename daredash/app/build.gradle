plugins { id 'com.android.application' }

// IDs and verification endpoint are public configuration, NOT credentials.
// Supply production values through GitHub Actions secrets/environment variables.
def config = { key -> (project.findProperty(key) ?: System.getenv(key) ?: '').toString().trim() }
def googleTestAppId = 'ca-app-pub-3940256099942544~3347511713'
def googleTestBanner = 'ca-app-pub-3940256099942544/6300978111'
def googleTestRewarded = 'ca-app-pub-3940256099942544/5224354917'
// Public IDs from the DareDash AdMob account. Optional CI vars can override these.
// Rewarded ID intentionally blank: the user supplied the same unit for Banner and Rewarded.
def prodAppId = config('DDA_ADMOB_APP_ID') ?: 'ca-app-pub-5654555743041629~9552640046'
def prodBannerId = config('DDA_ADMOB_BANNER_UNIT_ID') ?: 'ca-app-pub-5654555743041629/2510834956'
def prodRewardedId = config('DDA_ADMOB_REWARDED_UNIT_ID')
def verifyUrl = config('DDA_PURCHASE_VERIFY_URL')
def billingEnabled = config('DDA_ENABLE_PURCHASES').equalsIgnoreCase('true') && verifyUrl.startsWith('https://')
def asJavaString = { s -> '"' + s.replace('\\', '\\\\').replace('"', '\\"') + '"' }

android {
    namespace 'com.daredash.party'
    compileSdk 36

    buildFeatures { buildConfig true }

    defaultConfig {
        applicationId 'com.daredash.party'
        minSdk 24
        targetSdk 36
        versionCode 5
        versionName '1.4.0'
    }

    signingConfigs {
        if (project.hasProperty('DDA_KEYSTORE_FILE')) {
            create('upload') {
                storeFile file(project.property('DDA_KEYSTORE_FILE'))
                storePassword project.property('DDA_STORE_PASSWORD')
                keyAlias project.property('DDA_KEY_ALIAS')
                keyPassword project.property('DDA_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            manifestPlaceholders = [ADMOB_APP_ID: googleTestAppId]
            buildConfigField 'String', 'BANNER_AD_UNIT_ID', asJavaString(googleTestBanner)
            buildConfigField 'String', 'REWARDED_AD_UNIT_ID', asJavaString(googleTestRewarded)
            // Debug builds NEVER request live ads or grant unverified IAPs.
            buildConfigField 'String', 'PURCHASE_VERIFY_URL', '""'
            buildConfigField 'boolean', 'BILLING_ENABLED', 'false'
        }
        release {
            minifyEnabled false
            manifestPlaceholders = [ADMOB_APP_ID: prodAppId]
            buildConfigField 'String', 'BANNER_AD_UNIT_ID', asJavaString(prodBannerId)
            buildConfigField 'String', 'REWARDED_AD_UNIT_ID', asJavaString(prodRewardedId)
            buildConfigField 'String', 'PURCHASE_VERIFY_URL', asJavaString(verifyUrl)
            buildConfigField 'boolean', 'BILLING_ENABLED', billingEnabled.toString()
            if (project.hasProperty('DDA_KEYSTORE_FILE')) signingConfig signingConfigs.upload
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Release must use real, distinct ad unit IDs. An absent rewarded unit is safe
// (only banner ads run). Paid upgrades stay disabled until a verifier exists.
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.name in ['bundleRelease', 'assembleRelease'] }) {
        if (!(prodAppId ==~ /ca-app-pub-\d{16}~\d{10}/) ||
            prodAppId.contains('3940256099942544'))
            throw new GradleException('DareDash needs its real AdMob App ID for release.')
        if (!(prodBannerId ==~ /ca-app-pub-\d{16}\/\d{10}/) ||
            prodBannerId.contains('3940256099942544'))
            throw new GradleException('DareDash needs its real Banner ad unit for release.')
        if (prodRewardedId) {
            if (!(prodRewardedId ==~ /ca-app-pub-\d{16}\/\d{10}/) ||
                prodRewardedId == prodBannerId ||
                prodRewardedId.contains('3940256099942544'))
                throw new GradleException('Rewarded ad unit must be a separate valid production Rewarded ID.')
        }
        if (config('DDA_ENABLE_PURCHASES').equalsIgnoreCase('true') && !billingEnabled)
            throw new GradleException('Purchases cannot be enabled without HTTPS purchase verification.')
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
    implementation 'com.android.billingclient:billing:8.3.0'
}
