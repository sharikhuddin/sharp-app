name: Signed Google Play AAB
on:
  workflow_dispatch:
jobs:
  release-aab:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daredash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Decode temporary upload keystore
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          test -n "$UPLOAD_KEYSTORE_BASE64" || (echo 'Add UPLOAD_KEYSTORE_BASE64 secret first' && exit 1)
          printf %s "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
      - name: Build signed AAB
        env:
          STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: >-
          gradle :app:bundleRelease
          -PDDA_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          -PDDA_STORE_PASSWORD="$STORE_PASSWORD"
          -PDDA_KEY_ALIAS="$KEY_ALIAS"
          -PDDA_KEY_PASSWORD="$KEY_PASSWORD"
      - uses: actions/upload-artifact@v4
        with:
          name: DareDash-signed-Play-AAB
          path: daredash/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7
