name: Publish game and YapThing websites
# Normal low-cost hosting uses Settings > Pages > Deploy from a branch > main /docs.
# This workflow is manual-only so missing Pages enablement does not generate
# failed Actions runs and consume minutes for routine site commits.
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: public-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs
      - id: deployment
        uses: actions/deploy-pages@v4
