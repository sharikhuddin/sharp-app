name: DareDash emulator smoke and real screenshots
on:
  workflow_dispatch:
  push:
    paths:
      - 'daredash/app/**'
      - 'daredash/tools/capture_screenshots.sh'
      - '.github/workflows/emulator-screenshots.yml'
jobs:
  screenshot-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: daredash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Enable hardware acceleration where supported
        run: if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Build app and capture actual Android screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: cd daredash && gradle :app:assembleDebug --stacktrace && bash tools/capture_screenshots.sh
      - name: Upload real on-device screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DareDash-actual-emulator-screenshots
          path: daredash/play-store/screenshots/*
          if-no-files-found: warn
          retention-days: 14
