name: Android APK build
on:
  push:
    paths:
      - 'daredash/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
jobs:
  debug-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daredash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android 36 SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER" || (echo "Android SDK tools missing" && exit 1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0'
      - name: Compile and package debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Validate game tests and debug Android lint
        run: gradle :app:testDebugUnitTest :app:lintDebug --stacktrace
      - name: Validate release APK and AAB compilation (unsigned, not for distribution)
        run: gradle :app:assembleRelease :app:bundleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: DareDash-debug-APK
          path: daredash/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload unsigned release bundle for private upload-key signing
        uses: actions/upload-artifact@v4
        with:
          name: DareDash-unsigned-AAB
          path: daredash/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7
