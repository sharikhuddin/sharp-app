name: Android APK build
on:
  push:
    paths:
      - 'daredash/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
jobs:
  debug-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daredash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android 36 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Compile and package debug APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: DareDash-debug-APK
          path: daredash/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
